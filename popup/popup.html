<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Summarizer</title>
    <link rel="stylesheet" href="./popup.css" />
    <script src="./popup.js" defer></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <svg
            class="logo-mark"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
          >
            <rect x="1" y="1" width="7" height="7" rx="2" fill="#7c6aff" />
            <rect
              x="10"
              y="1"
              width="7"
              height="7"
              rx="2"
              fill="#7c6aff"
              opacity="0.5"
            />
            <rect
              x="1"
              y="10"
              width="7"
              height="7"
              rx="2"
              fill="#7c6aff"
              opacity="0.5"
            />
            <rect
              x="10"
              y="10"
              width="7"
              height="7"
              rx="2"
              fill="#7c6aff"
              opacity="0.3"
            />
          </svg>
          <span class="logo-text">PageSummarizer</span>
        </div>
        <span class="version-tag">AI</span>
      </header>

      <!-- Page Info -->
      <div class="page-info">
        <span class="live-dot"></span>
        <p id="page-title" class="page-title">No page detected</p>
      </div>

      <!-- Action Button -->
      <button
        id="summarize-btn"
        class="btn-primary"
        aria-label="Summarize this page"
      >
        <span class="btn-label">Summarize Page</span>
        <span class="btn-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path
              d="M2 7H12M8 3L12 7L8 11"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <!-- Loading State -->
      <div id="loading" class="loading hidden" role="status" aria-live="polite">
        <div class="loading-track">
          <div class="loading-bar"></div>
        </div>
        <p class="loading-label">
          Analyzing page content<span class="ellipsis"
            ><span>.</span><span>.</span><span>.</span></span
          >
        </p>
      </div>

      <!-- Error State -->
      <div id="error" class="error hidden" role="alert">
        <div class="error-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="#f87171" stroke-width="1.5" />
            <path
              d="M8 5V8.5M8 11H8.01"
              stroke="#f87171"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <p id="error-message">Something went wrong.</p>
      </div>

      <!-- Results -->
      <div id="results" class="results hidden">
        <!-- Reading time -->
        <div class="reading-time-row">
          <span class="clock-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <circle cx="6" cy="6" r="5" stroke="#7c6aff" stroke-width="1.2" />
              <path
                d="M6 3.5V6L7.5 7.5"
                stroke="#7c6aff"
                stroke-width="1.2"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <p class="reading-time" id="reading-time"></p>
        </div>

        <!-- Summary -->
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">Summary</h2>
            <div class="section-rule"></div>
          </div>
          <ul id="summary-list" class="summary-list"></ul>
        </div>

        <!-- Key Insights -->
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">Key Insights</h2>
            <div class="section-rule"></div>
          </div>
          <ul id="insights-list" class="insights-list"></ul>
        </div>

        <!-- Actions -->
        <div class="actions">
          <button id="copy-btn" class="btn-secondary" aria-label="Copy summary">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <rect
                x="4.5"
                y="4.5"
                width="7"
                height="7"
                rx="1.5"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <path
                d="M4.5 8.5H3A1.5 1.5 0 011.5 7V3A1.5 1.5 0 013 1.5H7A1.5 1.5 0 018.5 3V4.5"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
            </svg>
            Copy Summary
          </button>
          <button id="clear-btn" class="btn-ghost" aria-label="Clear results">
            Clear
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
